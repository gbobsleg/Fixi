name: Deploy production

# Manual run only (Actions tab > Deploy production > Run workflow): you choose when production changes.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy VPS
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/fixi
            # Pull first, so that a newly added or changed deploy script is the one that runs.
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            SKIP_GIT=1 bash deploy/production.sh
